n-top:2px}.tx-amount{font-size:14px;flex-shrink:0}.del-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;opacity:.55}.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;background:var(--blue-soft);color:var(--blue);margin-left:6px}.income-badge{background:var(--sage-soft);color:var(--sage)}.empty-note{font-size:14px;color:var(--ink-soft)}.warn-banner{font-size:14px;margin-bottom:16px;padding:10px 14px;border-radius:8px;background:var(--brick-soft);color:var(--brick)}.cat-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}.cat-row:last-child{margin-bottom:0}.cat-emoji{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}.cat-body{flex:1;min-width:0}.cat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:12px}.cat-name{font-size:14px;font-weight:500}.cat-value{font-size:14px}.cat-bar-bg{width:100%;height:9px;border-radius:999px;background:var(--paper-line-2);overflow:hidden}.cat-bar-fill{height:9px;border-radius:999px}.category-chart{display:flex;align-items:flex-end;gap:14px;overflow-x:auto;min-height:240px;padding:16px 4px 4px}.category-chart-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:72px;height:210px}.category-chart-value{font-size:10px;margin-bottom:6px;text-align:center;white-space:nowrap}.category-chart-bar{width:44px;min-height:4px;border-radius:7px 7px 0 0}.category-chart-label{font-size:10px;color:var(--ink-soft);margin-top:7px;text-align:center;max-width:72px}.formula-note{background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:12px;line-height:1.5}

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const COLORS={ink:'#1F2E27',sage:'#3F6350',brick:'#A85440',blue:'#4E7396',inkSoft:'#6B786F'};
const CATEGORIES=[
{id:'loan',label:'Empréstimo da casa',emoji:'🏠',color:'#8B5E3C'},
{id:'house',label:'Despesas da casa',emoji:'🔧',color:'#5F7A56'},
{id:'fixed',label:'Contas fixas',emoji:'🧾',color:'#4E7396'},
{id:'market',label:'Supermercado',emoji:'🛒',color:'#A85440'},
{id:'coffee',label:'Café',emoji:'☕',color:'#8B6A4A'},
{id:'insurance',label:'Seguro',emoji:'🛡️',color:'#3E7C82'},
{id:'phone',label:'Telefone',emoji:'📱',color:'#7A5C8B'},
{id:'courses',label:'Cursos',emoji:'📚',color:'#6A6F9C'},
{id:'apps',label:'Apps',emoji:'💻',color:'#5B8191'},
{id:'gym',label:'Academia',emoji:'🏋️',color:'#7D6A50'},
{id:'car',label:'Carro',emoji:'🚗',color:'#9C7A2E'},
{id:'other',label:'Outros',emoji:'✳️',color:'#8A8570'}
];
const STORAGE_KEY='expense-tracker-transactions-local-v1';
const FIXED_STORAGE_KEY='expense-tracker-fixed-expenses-local-v1';
const money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',currencyDisplay:'code'}).format(Number(n)||0);
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x}function addYears(d,n){const x=new Date(d);x.setFullYear(x.getFullYear()+n);return x}
function startOfWeek(d){const x=new Date(d),day=x.getDay(),diff=(day===0?-6:1)-day;x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x}function startOfMonth(d){const x=new Date(d);return new Date(x.getFullYear(),x.getMonth(),1)}function startOfYear(d){return new Date(d.getFullYear(),0,1)}function startOfQuarter(d){return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1)}
function startOfQuinzena(d){const x=new Date(d);return x.getDate()<=15?new Date(x.getFullYear(),x.getMonth(),1):new Date(x.getFullYear(),x.getMonth(),16)}function nextQuinzenaStart(s){return s.getDate()===1?new Date(s.getFullYear(),s.getMonth(),16):new Date(s.getFullYear(),s.getMonth()+1,1)}function prevQuinzenaStart(s){return s.getDate()===16?new Date(s.getFullYear(),s.getMonth(),1):new Date(s.getFullYear(),s.getMonth()-1,16)}function addQuinzenas(s,n){let x=new Date(s);if(n<0){for(let i=0;i<Math.abs(n);i++)x=prevQuinzenaStart(x)}else{for(let i=0;i<n;i++)x=nextQuinzenaStart(x)}return x}
const fmtWeek=d=>`${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}–${addDays(d,6).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}`;const fmtBi=d=>{const end=addDays(nextQuinzenaStart(d),-1);return `${String(d.getDate()).padStart(2,'0')}–${String(end.getDate()).padStart(2,'0')} ${d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}`};const fmtMonth=d=>d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','');const fmtQuarter=d=>`T${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`;const fmtYear=d=>String(d.getFullYear());const fmtDate=iso=>new Date(iso+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const PERIOD_CONFIG={week:{start:startOfWeek,step:(d,n)=>addDays(d,7*n),label:fmtWeek,noun:'semana'},biweek:{start:startOfQuinzena,step:(d,n)=>addQuinzenas(d,n),label:fmtBi,noun:'quinzena'},month:{start:startOfMonth,step:(d,n)=>addMonths(d,n),label:fmtMonth,noun:'mês'},quarter:{start:startOfQuarter,step:(d,n)=>addMonths(d,3*n),label:fmtQuarter,noun:'trimestre'},year:{start:startOfYear,step:(d,n)=>addYears(d,n),label:fmtYear,noun:'ano'}};
function fixedToAnnual(amount,frequency){const v=Number(amount)||0;if(frequency==='weekly')return v*52;if(frequency==='monthly')return v*12;return v}
function incomeToAnnual(amount,frequency){const v=Number(amount)||0;if(frequency==='weekly')return v*52;if(frequency==='biweekly')return v*26;if(frequency==='monthly')return v*12;if(frequency==='annual')return v;return 0}
function annualToPeriod(annual,periodType){if(periodType==='week')return annual/52;if(periodType==='biweek')return annual/26;if(periodType==='month')return annual/12;if(periodType==='quarter')return annual/4;return annual}
function frequencyLabel(f){if(f==='weekly')return'Semanal';if(f==='biweekly')return'Quinzenal';if(f==='monthly')return'Mensal';return'Anual'}
function ExpenseTracker(){
const[transactions,setTransactions]=useState([]),[fixedExpenses,setFixedExpenses]=useState([]),[loaded,setLoaded]=useState(false),[saveError,setSaveError]=useState(''),[periodType,setPeriodType]=useState('month'),[showForm,setShowForm]=useState(false),[formType,setFormType]=useState('expense'),[expenseKind,setExpenseKind]=useState('variable'),[formCategory,setFormCategory]=useState('market'),[formAmount,setFormAmount]=useState(''),[formDate,setFormDate]=useState(()=>new Date().toISOString().slice(0,10)),[formNote,setFormNote]=useState(''),[fixedFrequency,setFixedFrequency]=useState('monthly'),[incomeFrequency,setIncomeFrequency]=useState('monthly');
useEffect(()=>{try{const a=localStorage.getItem(STORAGE_KEY),b=localStorage.getItem(FIXED_STORAGE_KEY);setTransactions(a?JSON.parse(a):[]);setFixedExpenses(b?JSON.parse(b):[])}catch(e){setTransactions([]);setFixedExpenses([])}finally{setLoaded(true)}},[]);
useEffect(()=>{if(!loaded)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(transactions));localStorage.setItem(FIXED_STORAGE_KEY,JSON.stringify(fixedExpenses));setSaveError('')}catch(e){setSaveError('Não foi possível salvar neste navegador.')}},[transactions,fixedExpenses,loaded]);
const chartData=useMemo(()=>{const cfg=PERIOD_CONFIG[periodType],base=cfg.start(new Date()),periods=[];for(let i=5;i>=0;i--){const start=cfg.step(base,-i),end=cfg.step(start,1);periods.push({start,end,label:cfg.label(start)})}return periods.map(p=>{let income=0,variableExpense=0;transactions.forEach(t=>{const d=new Date(t.date+'T00:00:00');if(t.type==='income'&&t.incomeFrequency){const startDate=new Date(t.date+'T00:00:00');if(p.end>startDate)income+=annualToPeriod(incomeToAnnual(t.amount,t.incomeFrequency),periodType)}else if(d>=p.start&&d<p.end){if(t.type==='income')income+=Number(t.amount);else variableExpense+=Number(t.amount)}});const annualFixed=fixedExpenses.reduce((s,i)=>s+fixedToAnnual(i.amount,i.frequency),0),fixedExpense=annualToPeriod(annualFixed,periodType);return{label:p.label,Receita:income,Variavel:variableExpense,Fixa:fixedExpense,Despesa:variableExpense+fixedExpense,start:p.start,end:p.end}})},[transactions,fixedExpenses,periodType]);
const current=chartData[chartData.length-1]||{Receita:0,Despesa:0,label:''},currentSaved=current.Receita-current.Despesa,currentRate=current.Receita>0?currentSaved/current.Receita*100:0;
const fixedTotals=useMemo(()=>{const annual=fixedExpenses.reduce((s,i)=>s+fixedToAnnual(i.amount,i.frequency),0);return{annual,monthly:annual/12,weekly:annual/52}},[fixedExpenses]);
const fixedGroups=useMemo(()=>CATEGORIES.map(cat=>{const items=fixedExpenses.filter(i=>i.categoryId===cat.id).map(i=>({...i,annual:fixedToAnnual(i.amount,i.frequency),monthly:fixedToAnnual(i.amount,i.frequency)/12})).sort((a,b)=>b.monthly-a.monthly);const monthly=items.reduce((s,i)=>s+i.monthly,0);return{...cat,items,monthly}}).filter(g=>g.items.length).sort((a,b)=>b.monthly-a.monthly),[fixedExpenses]);
const categoryBreakdown=useMemo(()=>{if(!chartData.length)return[];const{start,end}=chartData[chartData.length-1],sums={};CATEGORIES.forEach(c=>sums[c.id]=0);transactions.forEach(t=>{if(t.type!=='expense')return;const d=new Date(t.date+'T00:00:00');if(d>=start&&d<end)sums[t.categoryId]=(sums[t.categoryId]||0)+Number(t.amount)});fixedExpenses.forEach(i=>sums[i.categoryId]=(sums[i.categoryId]||0)+annualToPeriod(fixedToAnnual(i.amount,i.frequency),periodType));const max=Math.max(1,...Object.values(sums));return CATEGORIES.map(c=>({...c,value:sums[c.id]||0,pct:(sums[c.id]||0)/max*100})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value)},[transactions,fixedExpenses,chartData,periodType]);
const maxChart=Math.max(1,...chartData.map(d=>Math.max(d.Receita,d.Variavel,d.Fixa)));const maxCategory=Math.max(1,...categoryBreakdown.map(c=>c.value));
const currentMonthIncome=useMemo(()=>{const annual=transactions.filter(t=>t.type==='income'&&t.incomeFrequency).reduce((s,t)=>s+incomeToAnnual(t.amount,t.incomeFrequency),0);return annual/12},[transactions]);
const recent=useMemo(()=>transactions.slice().sort((a,b)=>(a.date<b.date?1:-1)).slice(0,10),[transactions]);
function resetForm(){setFormType('expense');setExpenseKind('variable');setFormCategory('market');setFormAmount('');setFormDate(new Date().toISOString().slice(0,10));setFormNote('');setFixedFrequency('monthly');setIncomeFrequency('monthly')}
function handleAdd(){const amt=parseFloat(String(formAmount).replace(',','.'));if(!amt||amt<=0)return;if(formType==='expense'&&expenseKind==='fixed'){setFixedExpenses(p=>[...p,{id:Date.now().toString(36)+Math.random().toString(36).slice(2),categoryId:formCategory,amount:amt,frequency:fixedFrequency,note:formNote.trim()}])}else{setTransactions(p=>[...p,{id:Date.now().toString(36)+Math.random().toString(36).slice(2),type:formType,categoryId:formType==='expense'?formCategory:null,amount:amt,date:formDate,note:formNote.trim(),...(formType==='income'?{incomeFrequency}: {})}])}resetForm();setShowForm(false)}
const delTx=id=>setTransactions(p=>p.filter(t=>t.id!==id));const delFixed=id=>setFixedExpenses(p=>p.filter(t=>t.id!==id));const noun=PERIOD_CONFIG[periodType].noun;
return <div className="wrap">
<div className="header"><div><div className="eyebrow">Livro de contas</div><h1 className="ledger-font">Controle de Gastos</h1><p className="subtitle">Casa, mercado, café e o resto da vida, tudo num só lugar.</p></div><div className="stamp mono-font"><div className="stamp-value">AUD</div><div className="stamp-label">moeda<br/>principal</div></div></div>
{saveError&&<div className="warn-banner">{saveError}</div>}
<div className="toolbar"><div className="toggle">{[{id:'week',label:'Semanal'},{id:'biweek',label:'Quinzenal'},{id:'month',label:'Mensal'},{id:'quarter',label:'Trimestral'},{id:'year',label:'Anual'}].map(o=><button key={o.id} className={'toggle-btn'+(periodType===o.id?' active':'')} onClick={()=>setPeriodType(o.id)}>{o.label}</button>)}</div><button className="btn btn-primary" onClick={()=>setShowForm(s=>!s)}>{showForm?'✕ Fechar':'+ Lançar'}</button></div>
{showForm&&<div className="panel"><div className="type-toggle"><button className={'type-btn'+(formType==='expense'?' active-expense':'')} onClick={()=>setFormType('expense')}>Despesa</button><button className={'type-btn'+(formType==='income'?' active-income':'')} onClick={()=>setFormType('income')}>Receita</button></div>{formType==='expense'&&<><div className="section-label">Tipo de despesa</div><div className="type-toggle"><button className={'type-btn'+(expenseKind==='fixed'?' active-fixed':'')} onClick={()=>setExpenseKind('fixed')}>Despesa fixa</button><button className={'type-btn'+(expenseKind==='variable'?' active-variable':'')} onClick={()=>setExpenseKind('variable')}>Despesa variável</button></div></>}
<div className="form-grid">{formType==='expense'&&<div className="field-full"><label className="field-label">Categoria</label><select value={formCategory} onChange={e=>setFormCategory(e.target.value)}>{CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}</select></div>}<div><label className="field-label">Valor AUD</label><input type="text" inputMode="decimal" placeholder="0.00" value={formAmount} onChange={e=>setFormAmount(e.target.value)} className="mono-font"/></div>
{formType==='expense'&&expenseKind==='fixed'?<div><label className="field-label">Frequência</label><select value={fixedFrequency} onChange={e=>setFixedFrequency(e.target.value)}><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="annual">Anual</option></select><div className="helper">O app converte automaticamente para uma base mensal e anual.</div></div>:formType==='income'?<div><label className="field-label">Frequência da receita</label><select value={incomeFrequency} onChange={e=>setIncomeFrequency(e.target.value)}><option value="weekly">Semanal</option><option value="biweekly">Quinzenal</option><option value="monthly">Mensal</option><option value="annual">Anual</option></select><div className="helper">A receita será projetada automaticamente nos períodos do painel.</div></div>:<div><label className="field-label">Data</label><input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)}/></div>}
{formType==='income'&&<div><label className="field-label">Data de início</label><input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)}/></div>}<div className="field-full"><label className="field-label">{formType==='expense'&&expenseKind==='fixed'?'Nome ou observação':'Observação (opcional)'}</label><input type="text" value={formNote} onChange={e=>setFormNote(e.target.value)} placeholder={formType==='income'?'ex.: salário Lorena':'ex.: seguro do carro'}/></div></div><button className="btn btn-save" onClick={handleAdd}>Salvar lançamento</button></div>}
<div className="stat-grid"><div className="stat-card"><div className="stat-label">Receita da {noun}</div><div className="stat-value mono-font">{money(current.Receita)}</div>{currentMonthIncome>0&&periodType==='month'&&<div className="stat-sub">Receitas recorrentes estimadas no mês</div>}</div><div className="stat-card"><div className="stat-label">Despesa total da {noun}</div><div className="stat-value mono-font">{money(current.Despesa)}</div></div><div className="stat-card"><div className="stat-label">Saldo da {noun}</div><div className="stat-value mono-font">{money(currentSaved)}</div>{current.Receita>0&&<div className="stat-sub" style={{color:currentSaved>=0?COLORS.sage:COLORS.brick}}>{currentRate.toFixed(0)}% guardado</div>}</div></div>
<div className="card"><h2 className="card-title ledger-font">Estimativa das despesas fixas</h2><div className="fixed-summary"><div className="fixed-summary-box"><span>Por semana</span><strong className="mono-font">{money(fixedTotals.weekly)}</strong></div><div className="fixed-summary-box"><span>Por mês</span><strong className="mono-font">{money(fixedTotals.monthly)}</strong></div><div className="fixed-summary-box"><span>Por ano</span><strong className="mono-font">{money(fixedTotals.annual)}</strong></div></div></div>
<div className="card"><h2 className="card-title ledger-font">Despesas fixas por categoria</h2><p className="card-intro">Categorias e despesas ordenadas do maior para o menor, usando o valor mensal equivalente para comparar frequências diferentes.</p>{fixedGroups.length===0?<p className="empty-note">Ainda não há despesas fixas cadastradas.</p>:fixedGroups.map(g=><div className="category-group" key={g.id}><div className="category-head"><div className="category-head-left"><div className="category-emoji" style={{background:g.color+'20'}}>{g.emoji}</div><div><div className="category-title">{g.label}</div><div className="category-sub">Total mensal da categoria</div></div></div><div className="category-total mono-font">{money(g.monthly)}</div></div><div className="category-items">{g.items.map(i=><div className="tx-row" key={i.id}><div className="tx-body"><div className="tx-name">{i.note||g.label}<span className="badge">{frequencyLabel(i.frequency)}</span></div><div className="tx-date">{money(i.monthly)}/mês · {money(i.annual)}/ano</div></div><div className="tx-amount mono-font" style={{color:COLORS.blue}}>{money(i.amount)}</div><button className="del-btn" onClick={()=>delFixed(i.id)}>✕</button></div>)}</div></div>)}</div>
<div className="card"><h2 className="card-title ledger-font">Despesas variáveis cadastradas</h2>{transactions.filter(t=>t.type==='expense').length===0?<p className="empty-note">Ainda não há despesas variáveis cadastradas.</p>:transactions.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).map(t=>{const c=CATEGORIES.find(x=>x.id===t.categoryId);return <div className="tx-row" key={t.id}><div className="tx-icon" style={{background:(c?.color||COLORS.brick)+'20'}}>{c?.emoji||'✳️'}</div><div className="tx-body"><div className="tx-name">{c?.label||'Despesa'}{t.note&&<span className="tx-note"> · {t.note}</span>}</div><div className="tx-date">{fmtDate(t.date)}</div></div><div className="tx-amount mono-font" style={{color:COLORS.brick}}>−{money(t.amount)}</div><button className="del-btn" onClick={()=>delTx(t.id)}>✕</button></div>})}</div>
<div className="card"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,gap:12,flexWrap:'wrap'}}><h2 className="card-title ledger-font">Receita x Despesas</h2><div className="chart-legend"><span><span className="legend-dot" style={{background:COLORS.sage}}></span>Receita</span><span><span className="legend-dot" style={{background:COLORS.brick}}></span>Variável</span><span><span className="legend-dot" style={{background:COLORS.blue}}></span>Fixa</span></div></div><div className="chart-scroll">{chartData.map((d,i)=><div className="chart-col" key={i}><div className="chart-bars"><div className="chart-bar" title={`Receita: ${money(d.Receita)}`} style={{height:Math.max(2,d.Receita/maxChart*160),background:COLORS.sage}}></div><div className="chart-bar" title={`Despesa variável: ${money(d.Variavel)}`} style={{height:Math.max(2,d.Variavel/maxChart*160),background:COLORS.brick}}></div><div className="chart-bar" title={`Despesa fixa: ${money(d.Fixa)}`} style={{height:Math.max(2,d.Fixa/maxChart*160),background:COLORS.blue}}></div></div><div className="chart-col-label">{d.label}</div></div>)}</div></div>
<div className="card"><h2 className="card-title ledger-font">Comparação de gastos por categoria</h2><p className="card-intro">Mostra despesas fixas e variáveis da {noun} atual, ordenadas da categoria com maior gasto para a menor.</p>{categoryBreakdown.length===0?<p className="empty-note">Nenhuma despesa lançada neste período ainda.</p>:<><div className="category-chart">{categoryBreakdown.map(c=><div className="category-chart-col" key={c.id}><div className="category-chart-value mono-font">{money(c.value)}</div><div className="category-chart-bar" style={{height:Math.max(4,c.value/maxCategory*150),background:c.color}}></div><div className="category-chart-label">{c.emoji} {c.label}</div></div>)}</div><div style={{marginTop:18}}>{categoryBreakdown.map(c=><div className="cat-row" key={c.id}><div className="cat-emoji" style={{background:c.color+'20'}}>{c.emoji}</div><div className="cat-body"><div className="cat-top"><span className="cat-name">{c.label}</span><span className="cat-value mono-font">{money(c.value)}</span></div><div className="cat-bar-bg"><div className="cat-bar-fill" style={{width:c.pct+'%',background:c.color}}></div></div></div></div>)}</div></>}</div>
<div className="card" style={{marginBottom:0}}><h2 className="card-title ledger-font">Últimos lançamentos</h2>{recent.length===0?<p className="empty-note">Ainda não há lançamentos.</p>:recent.map(t=>{const c=t.type==='expense'?CATEGORIES.find(x=>x.id===t.categoryId):null;return <div className="tx-row" key={t.id}><div className="tx-icon" style={{background:(c?.color||(t.type==='income'?COLORS.sage:COLORS.brick))+'20'}}>{c?.emoji||(t.type==='income'?'💰':'✳️')}</div><div className="tx-body"><div className="tx-name">{c?.label||(t.type==='income'?'Receita':'Despesa')}{t.incomeFrequency&&<span className="badge income-badge">{frequencyLabel(t.incomeFrequency)}</span>}{t.note&&<span className="tx-note"> · {t.note}</span>}</div><div className="tx-date">{fmtDate(t.date)}</div></div><div className="tx-amount mono-font" style={{color:t.type==='income'?COLORS.sage:COLORS.brick}}>{t.type==='income'?'+':'−'}{money(t.amount)}</div><button className="del-btn" onClick={()=>delTx(t.id)}>✕</button></div>})}</div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<ExpenseTracker/>);
</script>
</body>
</html>
