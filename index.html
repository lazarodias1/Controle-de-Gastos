<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --ink: #1F2E27;
    --paper: #F5F1E6;
    --paper-line: #DED5B8;
    --paper-line-2: #E9E2CC;
    --brass: #B8923F;
    --sage: #3F6350;
    --sage-soft: #DDE6DE;
    --brick: #A85440;
    --brick-soft: #EEDCD5;
    --ink-soft: #6B786F;
    --blue: #4E7396;
    --blue-soft: #DEE8F1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  .ledger-font { font-family: 'Fraunces', serif; }
  .mono-font { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 16px; }
  @media (min-width: 768px) { .wrap { padding: 40px 32px; } }

  .header {
    display: flex; flex-direction: column; gap: 20px;
    justify-content: space-between; align-items: flex-start;
    padding-bottom: 24px; margin-bottom: 24px;
    border-bottom: 2px solid var(--ink);
  }
  @media (min-width: 768px) { .header { flex-direction: row; align-items: flex-start; } }

  .eyebrow { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
  h1 { font-size: 30px; margin: 0; font-weight: 600; }
  @media (min-width: 768px) { h1 { font-size: 36px; } }
  .subtitle { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }

  .stamp {
    flex-shrink: 0; width: 108px; height: 108px; border-radius: 50%;
    border: 2px dashed var(--brass); transform: rotate(-6deg);
    background: rgba(184,146,63,0.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stamp-value { font-size: 22px; font-weight: 600; line-height: 1; }
  .stamp-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; text-align: center; font-family: 'Inter', sans-serif; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .toggle { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--paper-line-2); }
  .toggle-btn { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; border: none; cursor: pointer; background: transparent; color: var(--ink-soft); }
  .toggle-btn.active { background: var(--ink); color: var(--paper); }

  .btn { border: none; cursor: pointer; border-radius: 999px; font-weight: 500; padding: 8px 18px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-save { background: var(--brass); color: white; font-weight: 600; border-radius: 8px; margin-top: 16px; padding: 10px 20px; }

  .panel, .card { background: white; border: 1px solid var(--paper-line); border-radius: 16px; padding: 18px; margin-bottom: 20px; }

  .type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .type-btn { flex: 1; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; background: var(--paper); color: var(--ink-soft); }
  .type-btn.active-expense { background: var(--brick-soft); color: var(--brick); }
  .type-btn.active-income { background: var(--sage-soft); color: var(--sage); }
  .type-btn.active-fixed { background: var(--blue-soft); color: var(--blue); }
  .type-btn.active-variable { background: var(--brick-soft); color: var(--brick); }

  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 14px 0 7px; }
  .helper { font-size: 12px; color: var(--ink-soft); margin-top: 5px; line-height: 1.45; }

  .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .field-full { grid-column: 1 / -1; }

  label.field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); display: block; margin-bottom: 4px; }

  select, input[type="text"], input[type="date"] {
    width: 100%; padding: 9px 12px; border-radius: 8px; font-size: 14px;
    border: 1px solid var(--paper-line); background: var(--paper); color: var(--ink); font-family: inherit;
  }

  select:focus, input:focus, button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brass); }

  .stat-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
  @media (min-width: 640px) { .stat-grid { grid-template-columns: repeat(3, 1fr); } }

  .stat-card { background: white; border: 1px solid var(--paper-line); border-radius: 16px; padding: 16px; }
  .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin-bottom: 8px; }
  .stat-value { font-size: 21px; font-weight: 600; }
  .stat-sub { font-size: 12px; margin-top: 4px; color: var(--ink-soft); }

  .card-title { font-size: 18px; font-weight: 600; margin: 0 0 12px 0; }
  .card-intro { font-size: 13px; color: var(--ink-soft); margin: -4px 0 16px; line-height: 1.5; }

  .chart-legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-soft); align-items: center; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; }

  .chart-scroll { display: flex; align-items: flex-end; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; min-width: 58px; flex-shrink: 0; }
  .chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 160px; }
  .chart-bar { width: 15px; border-radius: 3px 3px 0 0; }
  .chart-col-label { font-size: 10px; color: var(--ink-soft); margin-top: 6px; text-align: center; white-space: nowrap; }

  .fixed-chart {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: end;
    gap: 16px;
    min-height: 230px;
    padding: 14px 8px 0;
    border-top: 1px solid var(--paper-line-2);
  }
  .fixed-chart-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-width: 0; }
  .fixed-chart-value { font-size: 12px; margin-bottom: 8px; text-align: center; }
  .fixed-chart-bar {
    width: min(64px, 70%);
    min-height: 4px;
    border-radius: 7px 7px 0 0;
    background: var(--blue);
  }
  .fixed-chart-label { margin-top: 8px; font-size: 12px; color: var(--ink-soft); }

  .fixed-summary { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 18px; }
  @media (min-width: 640px) { .fixed-summary { grid-template-columns: repeat(3, 1fr); } }
  .fixed-summary-box { border: 1px solid var(--paper-line); background: var(--paper); border-radius: 12px; padding: 13px; }
  .fixed-summary-box strong { display: block; font-size: 19px; margin-top: 5px; }
  .fixed-summary-box span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }

  .cat-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-emoji { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .cat-body { flex: 1; min-width: 0; }
  .cat-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 12px; }
  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-value { font-size: 14px; }
  .cat-bar-bg { width: 100%; height: 5px; border-radius: 999px; background: var(--paper-line-2); }
  .cat-bar-fill { height: 5px; border-radius: 999px; }

  .tx-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--paper-line-2); }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .tx-body { flex: 1; min-width: 0; }
  .tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-note { color: var(--ink-soft); font-weight: 400; }
  .tx-date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .tx-amount { font-size: 14px; flex-shrink: 0; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 4px; opacity: .55; transition: opacity .15s; }
  .tx-row:hover .del-btn { opacity: 1; }

  .badge {
    display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    background: var(--blue-soft); color: var(--blue); margin-left: 6px;
  }

  .empty-note { font-size: 14px; color: var(--ink-soft); }
  .warn-banner { font-size: 14px; margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; background: var(--brick-soft); color: var(--brick); }

  .formula-note {
    background: var(--blue-soft);
    color: var(--blue);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    margin-top: 12px;
    line-height: 1.5;
  }
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const COLORS = {
  ink: "#1F2E27", paper: "#F5F1E6", paperLine: "#DED5B8", paperLine2: "#E9E2CC",
  brass: "#B8923F", sage: "#3F6350", sageSoft: "#DDE6DE",
  brick: "#A85440", brickSoft: "#EEDCD5", inkSoft: "#6B786F",
  blue: "#4E7396", blueSoft: "#DEE8F1"
};

const CATEGORIES = [
  { id: "loan", label: "Empréstimo da casa", emoji: "🏠", color: "#8B5E3C" },
  { id: "house", label: "Despesas da casa", emoji: "🔧", color: "#5F7A56" },
  { id: "fixed", label: "Contas fixas", emoji: "🧾", color: "#4E7396" },
  { id: "market", label: "Supermercado", emoji: "🛒", color: "#A85440" },
  { id: "coffee", label: "Café", emoji: "☕", color: "#8B6A4A" },
  { id: "insurance", label: "Seguro", emoji: "🛡️", color: "#3E7C82" },
  { id: "phone", label: "Telefone", emoji: "📱", color: "#7A5C8B" },
  { id: "courses", label: "Cursos", emoji: "📚", color: "#6A6F9C" },
  { id: "apps", label: "Apps", emoji: "💻", color: "#5B8191" },
  { id: "gym", label: "Academia", emoji: "🏋️", color: "#7D6A50" },
  { id: "car", label: "Carro", emoji: "🚗", color: "#9C7A2E" },
  { id: "other", label: "Outros", emoji: "✳️", color: "#8A8570" },
];

const STORAGE_KEY = "expense-tracker-transactions-local-v1";
const FIXED_STORAGE_KEY = "expense-tracker-fixed-expenses-local-v1";

const brl = (n) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(n) || 0);

function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function startOfMonth(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  return new Date(date.getFullYear(), date.getMonth(), 1);
}

function addDays(d, n) { const date = new Date(d); date.setDate(date.getDate() + n); return date; }
function addMonths(d, n) { const date = new Date(d); date.setMonth(date.getMonth() + n); return date; }
function addYears(d, n) { const date = new Date(d); date.setFullYear(date.getFullYear() + n); return date; }

function startOfQuinzena(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  return date.getDate() <= 15
    ? new Date(date.getFullYear(), date.getMonth(), 1)
    : new Date(date.getFullYear(), date.getMonth(), 16);
}

function nextQuinzenaStart(s) {
  return s.getDate() === 1
    ? new Date(s.getFullYear(), s.getMonth(), 16)
    : new Date(s.getFullYear(), s.getMonth() + 1, 1);
}

function prevQuinzenaStart(s) {
  return s.getDate() === 16
    ? new Date(s.getFullYear(), s.getMonth(), 1)
    : new Date(s.getFullYear(), s.getMonth() - 1, 16);
}

function addQuinzenas(start, n) {
  let cur = start;
  if (n < 0) {
    for (let i=0; i<-n; i++) cur = prevQuinzenaStart(cur);
  } else {
    for (let i=0; i<n; i++) cur = nextQuinzenaStart(cur);
  }
  return cur;
}

function startOfQuarter(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  const q = Math.floor(date.getMonth()/3);
  return new Date(date.getFullYear(), q*3, 1);
}

function startOfYear(d) { return new Date(d.getFullYear(), 0, 1); }

function fmtWeekLabel(d) {
  const end = addDays(d,6);
  const o = { day:"2-digit", month:"short" };
  return `${d.toLocaleDateString("pt-BR",o)}–${end.toLocaleDateString("pt-BR",o)}`;
}

function fmtQuinzenaLabel(start) {
  const end = nextQuinzenaStart(start);
  const last = addDays(end,-1);
  const dOpt = {day:"2-digit"};
  const mOpt = {month:"short"};
  return `${start.toLocaleDateString("pt-BR",dOpt)}–${last.toLocaleDateString("pt-BR",dOpt)} ${start.toLocaleDateString("pt-BR",mOpt).replace(".","")}`;
}

function fmtMonthLabel(d) { return d.toLocaleDateString("pt-BR", { month:"short", year:"2-digit" }).replace(".",""); }
function fmtQuarterLabel(d) { return `T${Math.floor(d.getMonth()/3)+1} ${d.getFullYear()}`; }
function fmtYearLabel(d) { return String(d.getFullYear()); }
function fmtDateShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"short" });
}

const PERIOD_CONFIG = {
  week: { start: startOfWeek, step: (d,n) => addDays(d, 7*n), label: fmtWeekLabel, noun: "semana" },
  biweek: { start: startOfQuinzena, step: (d,n) => addQuinzenas(d,n), label: fmtQuinzenaLabel, noun: "quinzena" },
  month: { start: startOfMonth, step: (d,n) => addMonths(d,n), label: fmtMonthLabel, noun: "mês" },
  quarter: { start: startOfQuarter, step: (d,n) => addMonths(d, 3*n), label: fmtQuarterLabel, noun: "trimestre" },
  year: { start: startOfYear, step: (d,n) => addYears(d,n), label: fmtYearLabel, noun: "ano" },
};

function fixedToAnnual(amount, frequency) {
  const value = Number(amount) || 0;
  if (frequency === "weekly") return value * 52;
  if (frequency === "monthly") return value * 12;
  return value;
}

function frequencyLabel(frequency) {
  if (frequency === "weekly") return "Semanal";
  if (frequency === "monthly") return "Mensal";
  return "Anual";
}

function ExpenseTracker() {
  const [transactions, setTransactions] = useState([]);
  const [fixedExpenses, setFixedExpenses] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState("");
  const [periodType, setPeriodType] = useState("month");
  const [showForm, setShowForm] = useState(false);

  const [formType, setFormType] = useState("expense");
  const [expenseKind, setExpenseKind] = useState("variable");
  const [formCategory, setFormCategory] = useState("market");
  const [formAmount, setFormAmount] = useState("");
  const [formDate, setFormDate] = useState(() => new Date().toISOString().slice(0,10));
  const [formNote, setFormNote] = useState("");
  const [fixedFrequency, setFixedFrequency] = useState("monthly");

  useEffect(() => {
    try {
      const rawTransactions = window.localStorage.getItem(STORAGE_KEY);
      const rawFixed = window.localStorage.getItem(FIXED_STORAGE_KEY);
      setTransactions(rawTransactions ? JSON.parse(rawTransactions) : []);
      setFixedExpenses(rawFixed ? JSON.parse(rawFixed) : []);
    } catch (e) {
      setTransactions([]);
      setFixedExpenses([]);
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
      window.localStorage.setItem(FIXED_STORAGE_KEY, JSON.stringify(fixedExpenses));
      setSaveError("");
    } catch (e) {
      setSaveError("Não foi possível salvar neste navegador.");
    }
  }, [transactions, fixedExpenses, loaded]);

  const chartData = useMemo(() => {
    const cfg = PERIOD_CONFIG[periodType];
    const now = new Date();
    const base = cfg.start(now);
    const periods = [];

    for (let i = 5; i >= 0; i--) {
      const start = cfg.step(base, -i);
      const end = cfg.step(start, 1);
      periods.push({ start, end, label: cfg.label(start) });
    }

    return periods.map((p) => {
      let income = 0;
      let variableExpense = 0;

      transactions.forEach((t) => {
        const d = new Date(t.date + "T00:00:00");
        if (d >= p.start && d < p.end) {
          if (t.type === "income") income += Number(t.amount);
          else variableExpense += Number(t.amount);
        }
      });

      const annualFixed = fixedExpenses.reduce((sum, item) => sum + fixedToAnnual(item.amount, item.frequency), 0);
      let fixedExpense = 0;

      if (periodType === "week") fixedExpense = annualFixed / 52;
      else if (periodType === "biweek") fixedExpense = annualFixed / 26;
      else if (periodType === "month") fixedExpense = annualFixed / 12;
      else if (periodType === "quarter") fixedExpense = annualFixed / 4;
      else fixedExpense = annualFixed;

      return {
        label: p.label,
        Receita: income,
        Variavel: variableExpense,
        Fixa: fixedExpense,
        Despesa: variableExpense + fixedExpense,
        start: p.start,
        end: p.end
      };
    });
  }, [transactions, fixedExpenses, periodType]);

  const current = chartData[chartData.length - 1] || { Receita: 0, Despesa: 0, label: "" };
  const currentSaved = current.Receita - current.Despesa;
  const currentRate = current.Receita > 0 ? (currentSaved / current.Receita) * 100 : 0;

  const categoryBreakdown = useMemo(() => {
    if (!chartData.length) return CATEGORIES.map((c) => ({ ...c, value: 0, pct: 0 }));

    const { start, end } = chartData[chartData.length - 1];
    const sums = {};
    CATEGORIES.forEach((c) => (sums[c.id] = 0));

    transactions.forEach((t) => {
      const d = new Date(t.date + "T00:00:00");
      if (t.type === "expense" && d >= start && d < end) {
        sums[t.categoryId] = (sums[t.categoryId] || 0) + Number(t.amount);
      }
    });

    fixedExpenses.forEach((item) => {
      const annual = fixedToAnnual(item.amount, item.frequency);
      let periodValue = 0;
      if (periodType === "week") periodValue = annual / 52;
      else if (periodType === "biweek") periodValue = annual / 26;
      else if (periodType === "month") periodValue = annual / 12;
      else if (periodType === "quarter") periodValue = annual / 4;
      else periodValue = annual;

      sums[item.categoryId] = (sums[item.categoryId] || 0) + periodValue;
    });

    const max = Math.max(1, ...Object.values(sums));
    return CATEGORIES.map((c) => ({ ...c, value: sums[c.id], pct: (sums[c.id] / max) * 100 }));
  }, [transactions, fixedExpenses, chartData, periodType]);

  const allTime = useMemo(() => {
    let income = 0;
    let expense = 0;

    transactions.forEach((t) => {
      if (t.type === "income") income += Number(t.amount);
      else expense += Number(t.amount);
    });

    const saved = income - expense;
    const rate = income > 0 ? (saved / income) * 100 : 0;
    return { income, expense, saved, rate };
  }, [transactions]);

  const fixedTotals = useMemo(() => {
    const annual = fixedExpenses.reduce((sum, item) => sum + fixedToAnnual(item.amount, item.frequency), 0);
    return {
      annual,
      monthly: annual / 12,
      weekly: annual / 52
    };
  }, [fixedExpenses]);

  const fixedChartMax = Math.max(1, fixedTotals.weekly, fixedTotals.monthly, fixedTotals.annual);

  const recent = useMemo(() => {
    const regular = transactions.map((t) => ({ ...t, source: "regular" }));
    const fixed = fixedExpenses.map((item) => ({
      ...item,
      source: "fixed",
      type: "expense",
      date: "9999-12-31"
    }));

    return [...fixed, ...regular]
      .sort((a,b) => (a.date < b.date ? 1 : -1))
      .slice(0, 10);
  }, [transactions, fixedExpenses]);

  const maxChart = Math.max(1, ...chartData.map(d => Math.max(d.Receita, d.Variavel, d.Fixa)));

  function resetForm() {
    setFormType("expense");
    setExpenseKind("variable");
    setFormCategory("market");
    setFormAmount("");
    setFormDate(new Date().toISOString().slice(0,10));
    setFormNote("");
    setFixedFrequency("monthly");
  }

  function handleAdd() {
    const amt = parseFloat(String(formAmount).replace(",", "."));
    if (!amt || amt <= 0) return;

    if (formType === "expense" && expenseKind === "fixed") {
      const fixed = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        categoryId: formCategory,
        amount: amt,
        frequency: fixedFrequency,
        note: formNote.trim()
      };
      setFixedExpenses((prev) => [...prev, fixed]);
    } else {
      const t = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        type: formType,
        categoryId: formType === "expense" ? formCategory : null,
        amount: amt,
        date: formDate,
        note: formNote.trim()
      };
      setTransactions((prev) => [...prev, t]);
    }

    resetForm();
    setShowForm(false);
  }

  function handleDelete(id) {
    setTransactions((prev) => prev.filter((t) => t.id !== id));
  }

  function handleDeleteFixed(id) {
    setFixedExpenses((prev) => prev.filter((item) => item.id !== id));
  }

  const periodNoun = PERIOD_CONFIG[periodType].noun;

  return (
    <div className="wrap">
      <div className="header">
        <div>
          <div className="eyebrow">Livro de contas</div>
          <h1 className="ledger-font">Controle de Gastos</h1>
          <p className="subtitle">Casa, mercado, café e o resto da vida — tudo lançado num só lugar.</p>
        </div>

        <div className="stamp mono-font">
          <div className="stamp-value">{allTime.income > 0 ? `${allTime.rate.toFixed(0)}%` : "—"}</div>
          <div className="stamp-label">poupado<br />no total</div>
        </div>
      </div>

      {saveError && <div className="warn-banner">{saveError}</div>}

      <div className="toolbar">
        <div className="toggle">
          {[
            {id:"week",label:"Semanal"},
            {id:"biweek",label:"Quinzenal"},
            {id:"month",label:"Mensal"},
            {id:"quarter",label:"Trimestral"},
            {id:"year",label:"Anual"}
          ].map((opt) => (
            <button
              key={opt.id}
              className={"toggle-btn" + (periodType === opt.id ? " active" : "")}
              onClick={() => setPeriodType(opt.id)}
            >
              {opt.label}
            </button>
          ))}
        </div>

        <button className="btn btn-primary" onClick={() => setShowForm((s) => !s)}>
          {showForm ? "✕ Fechar" : "+ Lançar"}
        </button>
      </div>

      {showForm && (
        <div className="panel">
          <div className="type-toggle">
            <button
              className={"type-btn" + (formType === "expense" ? " active-expense" : "")}
              onClick={() => setFormType("expense")}
            >
              Despesa
            </button>
            <button
              className={"type-btn" + (formType === "income" ? " active-income" : "")}
              onClick={() => setFormType("income")}
            >
              Receita
            </button>
          </div>

          {formType === "expense" && (
            <>
              <div className="section-label">Tipo de despesa</div>
              <div className="type-toggle">
                <button
                  className={"type-btn" + (expenseKind === "fixed" ? " active-fixed" : "")}
                  onClick={() => setExpenseKind("fixed")}
                >
                  Despesa fixa
                </button>
                <button
                  className={"type-btn" + (expenseKind === "variable" ? " active-variable" : "")}
                  onClick={() => setExpenseKind("variable")}
                >
                  Despesa variável
                </button>
              </div>
            </>
          )}

          <div className="form-grid">
            {formType === "expense" && (
              <div className="field-full">
                <label className="field-label">Categoria</label>
                <select value={formCategory} onChange={(e) => setFormCategory(e.target.value)}>
                  {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              </div>
            )}

            <div>
              <label className="field-label">Valor (R$)</label>
              <input
                type="text"
                inputMode="decimal"
                placeholder="0,00"
                value={formAmount}
                onChange={(e) => setFormAmount(e.target.value)}
                className="mono-font"
              />
            </div>

            {formType === "expense" && expenseKind === "fixed" ? (
              <div>
                <label className="field-label">Frequência</label>
                <select value={fixedFrequency} onChange={(e) => setFixedFrequency(e.target.value)}>
                  <option value="weekly">Semanal</option>
                  <option value="monthly">Mensal</option>
                  <option value="annual">Anual</option>
                </select>
                <div className="helper">
                  O app converte este valor automaticamente para semana, mês e ano.
                </div>
              </div>
            ) : (
              <div>
                <label className="field-label">Data</label>
                <input type="date" value={formDate} onChange={(e) => setFormDate(e.target.value)} />
              </div>
            )}

            <div className="field-full">
              <label className="field-label">
                {formType === "expense" && expenseKind === "fixed" ? "Nome ou observação" : "Observação (opcional)"}
              </label>
              <input
                type="text"
                placeholder={formType === "expense" && expenseKind === "fixed" ? "ex.: internet, academia, seguro da casa" : "ex.: café com a Ju no sábado"}
                value={formNote}
                onChange={(e) => setFormNote(e.target.value)}
              />
            </div>
          </div>

          <button className="btn btn-save" onClick={handleAdd}>Salvar lançamento</button>
        </div>
      )}

      <div className="stat-grid">
        <div className="stat-card">
          <div className="stat-label">Receita da {periodNoun}</div>
          <div className="stat-value mono-font">{brl(current.Receita)}</div>
        </div>

        <div className="stat-card">
          <div className="stat-label">Despesa total da {periodNoun}</div>
          <div className="stat-value mono-font">{brl(current.Despesa)}</div>
        </div>

        <div className="stat-card">
          <div className="stat-label">Saldo da {periodNoun}</div>
          <div className="stat-value mono-font">{brl(currentSaved)}</div>
          {current.Receita > 0 && (
            <div className="stat-sub" style={{color: currentSaved >= 0 ? COLORS.sage : COLORS.brick}}>
              {currentRate.toFixed(0)}% guardado
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <h2 className="card-title ledger-font">Estimativa das despesas fixas</h2>
        <p className="card-intro">
          Todos os gastos fixos são convertidos para uma base anual e depois apresentados também como média mensal e semanal.
        </p>

        <div className="fixed-summary">
          <div className="fixed-summary-box">
            <span>Por semana</span>
            <strong className="mono-font">{brl(fixedTotals.weekly)}</strong>
          </div>
          <div className="fixed-summary-box">
            <span>Por mês</span>
            <strong className="mono-font">{brl(fixedTotals.monthly)}</strong>
          </div>
          <div className="fixed-summary-box">
            <span>Por ano</span>
            <strong className="mono-font">{brl(fixedTotals.annual)}</strong>
          </div>
        </div>

        {fixedExpenses.length === 0 ? (
          <p className="empty-note">Ainda não há despesas fixas cadastradas.</p>
        ) : (
          <>
            <div className="fixed-chart">
              {[
                { label: "Semanal", value: fixedTotals.weekly },
                { label: "Mensal", value: fixedTotals.monthly },
                { label: "Anual", value: fixedTotals.annual }
              ].map((item) => (
                <div className="fixed-chart-col" key={item.label}>
                  <div className="fixed-chart-value mono-font">{brl(item.value)}</div>
                  <div
                    className="fixed-chart-bar"
                    title={`${item.label}: ${brl(item.value)}`}
                    style={{height: Math.max(4, (item.value / fixedChartMax) * 150)}}
                  ></div>
                  <div className="fixed-chart-label">{item.label}</div>
                </div>
              ))}
            </div>

            <div className="formula-note">
              Cálculo usado: semanal × 52; mensal × 12; anual × 1. Depois, o total anual é dividido por 52 para a média semanal e por 12 para a média mensal.
            </div>
          </>
        )}
      </div>

      <div className="card">
        <h2 className="card-title ledger-font">Despesas fixas cadastradas</h2>

        {fixedExpenses.length === 0 ? (
          <p className="empty-note">Use “+ Lançar”, escolha “Despesa fixa” e informe a frequência.</p>
        ) : (
          fixedExpenses.map((item) => {
            const cat = CATEGORIES.find((c) => c.id === item.categoryId);
            const annual = fixedToAnnual(item.amount, item.frequency);
            const weekly = annual / 52;
            const monthly = annual / 12;

            return (
              <div className="tx-row" key={item.id}>
                <div className="tx-icon" style={{background: (cat?.color || COLORS.blue) + "20"}}>
                  {cat?.emoji || "🧾"}
                </div>
                <div className="tx-body">
                  <div className="tx-name">
                    {item.note || cat?.label || "Despesa fixa"}
                    <span className="badge">{frequencyLabel(item.frequency)}</span>
                  </div>
                  <div className="tx-date">
                    {brl(weekly)}/semana · {brl(monthly)}/mês · {brl(annual)}/ano
                  </div>
                </div>
                <div className="tx-amount mono-font" style={{color: COLORS.blue}}>
                  {brl(item.amount)}
                </div>
                <button className="del-btn" onClick={() => handleDeleteFixed(item.id)} aria-label="Excluir despesa fixa">✕</button>
              </div>
            );
          })
        )}
      </div>

      <div className="card">
        <h2 className="card-title ledger-font">Despesas variáveis cadastradas</h2>

        {transactions.filter((t) => t.type === "expense").length === 0 ? (
          <p className="empty-note">Ainda não há despesas variáveis cadastradas.</p>
        ) : (
          [...transactions]
            .filter((t) => t.type === "expense")
            .sort((a,b) => (a.date < b.date ? 1 : -1))
            .map((t) => {
              const cat = CATEGORIES.find((c) => c.id === t.categoryId);
              return (
                <div className="tx-row" key={t.id}>
                  <div className="tx-icon" style={{background: (cat?.color || COLORS.brick) + "20"}}>
                    {cat?.emoji || "✳️"}
                  </div>
                  <div className="tx-body">
                    <div className="tx-name">
                      {cat?.label || "Despesa variável"}
                      {t.note ? <span className="tx-note"> · {t.note}</span> : null}
                    </div>
                    <div className="tx-date">{fmtDateShort(t.date)}</div>
                  </div>
                  <div className="tx-amount mono-font" style={{color: COLORS.brick}}>
                    −{brl(t.amount)}
                  </div>
                  <button className="del-btn" onClick={() => handleDelete(t.id)} aria-label="Excluir despesa variável">✕</button>
                </div>
              );
            })
        )}
      </div>

      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
          <h2 className="card-title ledger-font">Receita x Despesas</h2>
          <div className="chart-legend">
            <span><span className="legend-dot" style={{background: COLORS.sage}}></span>Receita</span>
            <span><span className="legend-dot" style={{background: COLORS.brick}}></span>Variável</span>
            <span><span className="legend-dot" style={{background: COLORS.blue}}></span>Fixa</span>
          </div>
        </div>

        <div className="chart-scroll">
          {chartData.map((d, i) => (
            <div className="chart-col" key={i}>
              <div className="chart-bars">
                <div
                  className="chart-bar"
                  title={`Receita: ${brl(d.Receita)}`}
                  style={{height: Math.max(2, (d.Receita/maxChart)*160), background: COLORS.sage}}
                ></div>
                <div
                  className="chart-bar"
                  title={`Despesa variável: ${brl(d.Variavel)}`}
                  style={{height: Math.max(2, (d.Variavel/maxChart)*160), background: COLORS.brick}}
                ></div>
                <div
                  className="chart-bar"
                  title={`Despesa fixa estimada: ${brl(d.Fixa)}`}
                  style={{height: Math.max(2, (d.Fixa/maxChart)*160), background: COLORS.blue}}
                ></div>
              </div>
              <div className="chart-col-label">{d.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <h2 className="card-title ledger-font">Por categoria — {current.label || `${periodNoun} atual`}</h2>

        {categoryBreakdown.every((c) => c.value === 0) ? (
          <p className="empty-note">Nenhuma despesa lançada neste período ainda.</p>
        ) : (
          categoryBreakdown.map((c) => (
            <div className="cat-row" key={c.id}>
              <div className="cat-emoji" style={{background: c.color + "20"}}>{c.emoji}</div>
              <div className="cat-body">
                <div className="cat-top">
                  <span className="cat-name">{c.label}</span>
                  <span className="cat-value mono-font">{brl(c.value)}</span>
                </div>
                <div className="cat-bar-bg">
                  <div className="cat-bar-fill" style={{width: c.pct + "%", background: c.color}}></div>
                </div>
              </div>
            </div>
          ))
        )}
      </div>

      <div className="card" style={{marginBottom: 0}}>
        <h2 className="card-title ledger-font">Últimos lançamentos</h2>

        {recent.length === 0 ? (
          <p className="empty-note">Ainda não há lançamentos. Toque em "+ Lançar" para começar.</p>
        ) : (
          recent.map((t) => {
            const cat = t.type === "expense" ? CATEGORIES.find((c) => c.id === t.categoryId) : null;
            const emoji = cat ? cat.emoji : "💰";
            const color = t.source === "fixed" ? COLORS.blue : (cat ? cat.color : COLORS.sage);

            return (
              <div className="tx-row" key={`${t.source}-${t.id}`}>
                <div className="tx-icon" style={{background: color + "20"}}>{emoji}</div>
                <div className="tx-body">
                  <div className="tx-name">
                    {cat ? cat.label : "Receita"}
                    {t.source === "fixed" ? <span className="badge">Fixa</span> : null}
                    {t.note ? <span className="tx-note"> · {t.note}</span> : null}
                  </div>
                  <div className="tx-date">
                    {t.source === "fixed" ? `${frequencyLabel(t.frequency)} · ${brl(fixedToAnnual(t.amount, t.frequency)/12)}/mês` : fmtDateShort(t.date)}
                  </div>
                </div>
                <div className="tx-amount mono-font" style={{color: t.type === "income" ? COLORS.sage : (t.source === "fixed" ? COLORS.blue : COLORS.brick)}}>
                  {t.type === "income" ? "+" : "−"}{brl(t.amount)}
                </div>
                <button
                  className="del-btn"
                  onClick={() => t.source === "fixed" ? handleDeleteFixed(t.id) : handleDelete(t.id)}
                  aria-label="Excluir lançamento"
                >✕</button>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ExpenseTracker />);
</script>
</body>
</html>
